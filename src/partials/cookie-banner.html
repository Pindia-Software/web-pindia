<div
  id="cookie-banner"
  class="cookie-banner"
  role="dialog"
  aria-live="polite"
  aria-labelledby="cookie-banner-title"
  aria-describedby="cookie-banner-text">
  <div class="cookie-banner__card">
    <div class="cookie-banner__mascot" aria-hidden="true">
      <img
        src="/assets/img/cookie-mascot.webp"
        alt=""
        width="128"
        height="128"
        loading="lazy"
        decoding="async">
    </div>
    <div class="cookie-banner__body">
      <p class="cookie-banner__eyebrow">
        <span class="cookie-banner__dot" aria-hidden="true"></span>
        Cookies
      </p>
      <h2 id="cookie-banner-title" class="cookie-banner__title">
        ¡Hola! Soy Pin <span aria-hidden="true">👋</span>
      </h2>
      <p id="cookie-banner-text" class="cookie-banner__text">
        Utilizamos cookies para entender qué funciona y mejorar la web. Nada raro, nada vendido a terceros — tú decides. Detalles en la <a href="/politica-cookies.html">política de cookies</a>.
      </p>
      <div class="cookie-banner__actions">
        <button id="cookie-reject" type="button" class="btn btn--ghost cookie-banner__btn">Rechazar</button>
        <button id="cookie-settings-open" type="button" class="btn btn--secondary cookie-banner__btn">Configurar</button>
        <button id="cookie-accept" type="button" class="btn btn--primary cookie-banner__btn">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<!-- @include cookie-settings -->
