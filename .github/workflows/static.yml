# Deploy static site to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site directory
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='README.md' \
            --exclude='MANUAL_pindia.pdf' \
            --exclude='*.original.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ _site/
          touch _site/.nojekyll

      - name: Rewrite absolute paths for project page base
        env:
          BASE: /${{ github.event.repository.name }}
        run: |
          echo "Rewriting absolute paths to prefix ${BASE}"
          # Top-level paths that exist in the repo and must be prefixed.
          PREFIXES='assets css js blog contacto productos proyectos servicios pindia_svg_resources manifest.webmanifest sitemap.xml robots.txt aviso-legal.html politica-cookies.html politica-privacidad.html index.html'

          find _site -type f \( \
              -name '*.html' -o -name '*.htm' -o \
              -name '*.css'  -o -name '*.js'  -o \
              -name '*.json' -o -name '*.webmanifest' -o \
              -name '*.xml'  -o -name '*.txt'  -o -name '*.svg' \
            \) -print0 | while IFS= read -r -d '' f; do
              for p in $PREFIXES; do
                # Match "/p" or "/p/" or "/p?" or "/p#" preceded by a quote, paren, space, or comma
                # Use perl for reliable lookbehind-style replacement.
                perl -i -pe "s{(['\"\\(\\s,])/${p}(?=[/\"'\\)\\?#\\s,]|\$)}{\$1${BASE}/${p}}g" "$f"
              done
            done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
